  <g transform="translate(1726.4666644647057, 654.8149019970652)">
    <image href="species_assets/brent_goose.png" x="-100" y="-100" width="200" height="200" clip-path="url(#circle-clip)" preserveAspectRatio="xMidYMid slice" filter="url(#shadow)" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#fff" stroke-width="4" />
    <text x="0" y="130" text-anchor="middle" fill="#2c3e50" font-size="28" font-weight="bold">Brent Goose</text>
    <text x="0" y="160" text-anchor="middle" fill="#555" font-size="20">Peak overwintering season. Tens</text>
    <text x="0" y="185" text-anchor="middle" fill="#555" font-size="20">of thousands settled.</text>
  </g>
  <g transform="translate(1791.171425740336, 2586.666554575202)">
    <image href="species_assets/harbour_seal.png" x="-100" y="-100" width="200" height="200" clip-path="url(#circle-clip)" preserveAspectRatio="xMidYMid slice" filter="url(#shadow)" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#fff" stroke-width="4" />
    <text x="0" y="130" text-anchor="middle" fill="#2c3e50" font-size="28" font-weight="bold">Common Seal</text>
    <text x="0" y="160" text-anchor="middle" fill="#555" font-size="20">Pupping season begins on</text>
    <text x="0" y="185" text-anchor="middle" fill="#555" font-size="20">the harbour mudflats.</text>
  </g>
  <g transform="translate(1765.1650429449553, 1765.1650429449553)">
    <image href="species_assets/sea_kale.png" x="-100" y="-100" width="200" height="200" clip-path="url(#circle-clip)" preserveAspectRatio="xMidYMid slice" filter="url(#shadow)" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#fff" stroke-width="4" />
    <text x="0" y="130" text-anchor="middle" fill="#2c3e50" font-size="28" font-weight="bold">Sea Kale</text>
    <text x="0" y="160" text-anchor="middle" fill="#555" font-size="20">Transitions from flowering to</text>
    <text x="0" y="185" text-anchor="middle" fill="#555" font-size="20">green seed pods.</text>
  </g>
  <g transform="translate(1941.9417382415922, 1941.9417382415922)">
    <image href="species_assets/roe_deer.png" x="-100" y="-100" width="200" height="200" clip-path="url(#circle-clip)" preserveAspectRatio="xMidYMid slice" filter="url(#shadow)" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#fff" stroke-width="4" />
    <text x="0" y="130" text-anchor="middle" fill="#2c3e50" font-size="28" font-weight="bold">Roe Deer</text>
    <text x="0" y="160" text-anchor="middle" fill="#555" font-size="20">Fawns are born</text>
    <text x="0" y="185" text-anchor="middle" fill="#555" font-size="20">in surrounding woodlands.</text>
  </g>
  <g transform="translate(2118.718433538229, 2118.718433538229)">
    <image href="species_assets/common_tern.png" x="-100" y="-100" width="200" height="200" clip-path="url(#circle-clip)" preserveAspectRatio="xMidYMid slice" filter="url(#shadow)" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#fff" stroke-width="4" />
    <text x="0" y="130" text-anchor="middle" fill="#2c3e50" font-size="28" font-weight="bold">Common Tern</text>
    <text x="0" y="160" text-anchor="middle" fill="#555" font-size="20">Actively nesting and</text>
    <text x="0" y="185" text-anchor="middle" fill="#555" font-size="20">establishing breeding territories.</text>
  </g>
  <g transform="translate(2586.666554575202, 1791.171425740336)">
    <image href="species_assets/cuttlefish.png" x="-100" y="-100" width="200" height="200" clip-path="url(#circle-clip)" preserveAspectRatio="xMidYMid slice" filter="url(#shadow)" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#fff" stroke-width="4" />
    <text x="0" y="130" text-anchor="middle" fill="#2c3e50" font-size="28" font-weight="bold">Cuttlefish</text>
    <text x="0" y="160" text-anchor="middle" fill="#555" font-size="20">Migrating into shallow</text>
    <text x="0" y="185" text-anchor="middle" fill="#555" font-size="20">waters to breed.</text>
